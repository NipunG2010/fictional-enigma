[package]
name = "end-to-end-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
polars = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
chrono = { workspace = true }
toml = "0.8"

# Testing specific dependencies
uuid = { version = "1.0", features = ["v4", "serde"] }
tempfile = "3.0"
rand = "0.8"
rand_chacha = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
clap = { version = "4.0", features = ["derive"] }

# Local crates
feature-pipeline = { path = "../feature-pipeline" }
ldc-engine = { path = "../ldc-engine" }
signal-fusion = { path = "../signal-fusion" }

[[bin]]
name = "test-runner"
path = "src/bin/test_runner.rs"

[[bin]]
name = "test-report-generator"
path = "src/bin/test_report_generator.rs"

[[bin]]
name = "ci-helper"
path = "src/bin/ci_helper.rs"

[dev-dependencies]
tokio-test = "0.4"