[workspace]
resolver = "2"
members = [
    "inference-engine",
    "feature-pipeline",
    "ldc-engine",
    "signal-fusion",
    "training-data-cli",
    "end-to-end-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IMP Team"]
license = "MIT"
repository = "https://github.com/your-org/IMP"



[workspace.dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# Data processing
polars = {version = "0.51", features = [
    "lazy",
    "parquet",
    "csv",
    "dtype-date",
    "dtype-datetime",
    "dtype-time",
    "dtype-duration",
    "rolling_window",
    "cum_agg",
    "ewma",
    "temporal",
    "polars-ops",
    "abs"
] }
arrow2 = "0.17"
parquet = "0.17"

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }

# Math and ML
ndarray = "0.15"
rayon = "1.7"

# Configuration
config = "0.13"
clap = { version = "4.0", features = ["derive"] }
# Temporarily disable clap for end-to-end-tests due to dependency issues

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hashing
ahash = "0.8"

# Metrics
prometheus = "0.13"
