[workspace]
members = [
    "inference-engine",
    "feature-pipeline",
    "ldc-engine",
    "signal-fusion",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IMP Team"]
license = "MIT"
repository = "https://github.com/your-org/IMP"

resolver = "2"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# Data processing
polars = { version = "0.45", features = ["lazy", "temporal", "strings", "dtype-categorical"] }
arrow2 = "0.17"
parquet = "0.17"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Math and ML
ndarray = "0.15"
rayon = "1.7"

# Configuration
config = "0.13"
clap = { version = "4.0", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hashing
ahash = "0.8"

# Metrics
prometheus = "0.13"
