name: Research Environment Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'py/**'
      - 'notebooks/**'
      - '.github/workflows/research-environment-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'py/**'
      - 'notebooks/**'
      - '.github/workflows/research-environment-tests.yml'

jobs:
  test-environment:
    name: Test Research Environment
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./py
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,optimization,research]"

    - name: Validate environment
      working-directory: ./py
      run: |
        python -m imp.utils.env_validator

    - name: Run unit tests
      working-directory: ./py
      run: |
        pytest tests/ -v --tb=short -m "not slow and not notebook"

    - name: Run research framework tests
      working-directory: ./py
      run: |
        pytest tests/test_research_framework.py -v

    - name: Run integration tests
      working-directory: ./py
      run: |
        pytest tests/ -v -m integration --tb=short

    - name: Check code formatting
      working-directory: ./py
      run: |
        black --check imp/ tests/
        isort --check-only imp/ tests/

    - name: Lint code
      working-directory: ./py
      run: |
        flake8 imp/ tests/ --max-line-length=88 --extend-ignore=E203,W503

  test-notebooks:
    name: Test Notebook Execution
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./py
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,optimization,research]"

    - name: Install notebook testing tools
      working-directory: ./py
      run: |
        pip install nbval papermill

    - name: Test notebook execution
      working-directory: ./py
      run: |
        pytest tests/test_notebook_integration.py -v -m notebook

    - name: Validate notebook outputs
      working-directory: ./py
      run: |
        # Run notebooks with papermill to ensure they execute
        python tests/run_research_tests.py --notebooks-only

  test-compatibility:
    name: Test Production Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./py
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,optimization,research]"

    - name: Test artifact compatibility
      working-directory: ./py
      run: |
        pytest tests/test_performance_compatibility.py -v

    - name: Test data integration
      working-directory: ./py
      run: |
        pytest tests/test_data_integration.py -v

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./py
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,optimization,research]"

    - name: Run tests with coverage
      working-directory: ./py
      run: |
        pytest tests/ --cov=imp --cov-report=xml --cov-report=html -m "not slow"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./py/coverage.xml
        flags: research-environment
        name: research-env-coverage

    - name: Archive coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: ./py/htmlcov/

  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      working-directory: ./py
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,research]"
        pip install sphinx sphinx-rtd-theme

    - name: Check documentation
      working-directory: ./py
      run: |
        # Verify all documentation files exist
        test -f docs/DEVELOPMENT_SETUP.md
        test -f imp/hmm/README.md
        test -f imp/data/README.md
        test -f tests/RESEARCH_TESTING_GUIDE.md

    - name: Validate markdown
      run: |
        # Check for broken links in documentation
        find py/docs -name "*.md" -type f -exec echo "Checking {}" \;
